<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAND-MAID · Video Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f7f6f3;
      --surface:  #ffffff;
      --border:   #e2e0d9;
      --text:     #1a1916;
      --muted:    #6b6960;
      --accent:   #1a1916;
      --thumb:    #c8c5bc;
      --red:      #c0392b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #111110;
        --surface: #1c1b19;
        --border:  #2e2d2a;
        --text:    #f0ede6;
        --muted:   #908d85;
        --accent:  #f0ede6;
        --thumb:   #3a3935;
        --red:     #e05c4a;
      }
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.6; }

    /* ── Layout ── */
    header {
      padding: 3rem 0 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    header p {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
    }

    main { max-width: 860px; margin: 0 auto; padding: 0 1.25rem 4rem; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 0.5rem;
      padding: 1.5rem 0 1.25rem;
      flex-wrap: wrap;
      align-items: center;
    }

    #query {
      flex: 1;
      min-width: 200px;
      height: 40px;
      padding: 0 0.9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    #query:focus { border-color: var(--muted); }
    #query::placeholder { color: var(--thumb); }

    select, button {
      height: 40px;
      padding: 0 0.9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    select:focus, button:focus { border-color: var(--muted); }

    button#searchBtn {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 500;
      padding: 0 1.2rem;
      letter-spacing: 0.03em;
    }
    button#searchBtn:hover { opacity: 0.85; }
    button#searchBtn:active { opacity: 0.7; }
    button#searchBtn:disabled { opacity: 0.4; cursor: default; }

    /* ── Meta bar ── */
    .meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      min-height: 1.6rem;
    }
    .meta .warn { color: var(--red); }

    /* ── Results ── */
    #results { display: flex; flex-direction: column; gap: 0; }

    .result-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 1rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.1s;
    }
    .result-item:hover { background: var(--surface); margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; border-radius: 4px; }

    .thumb-wrap {
      position: relative;
      width: 160px;
      aspect-ratio: 16/9;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .duration {
      position: absolute;
      bottom: 4px;
      right: 5px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 2px;
      letter-spacing: 0.02em;
    }

    .info { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }

    .info .title {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .info .channel {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .info .dateline {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--thumb);
      letter-spacing: 0.02em;
      margin-top: auto;
    }

    /* match highlight */
    .match-badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      background: var(--border);
      color: var(--muted);
      border-radius: 2px;
      padding: 1px 5px;
      letter-spacing: 0.04em;
      margin-top: 0.2rem;
      align-self: flex-start;
    }

    /* ── State ── */
    #status {
      text-align: center;
      padding: 3rem 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    #status.error { color: var(--red); }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 1.5px solid var(--border);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      padding-top: 2rem;
    }
    .pagination button { min-width: 80px; }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .result-item { grid-template-columns: 120px 1fr; }
      .thumb-wrap { width: 120px; }
    }
  </style>
</head>
<body>

<header>
  <h1>BAND-MAID · Video Search</h1>
  <p>band-maid &amp; band-maiko · youtube</p>
</header>

<main>
  <div class="controls">
    <input type="text" id="query" placeholder="Optional keywords…" value="" autocomplete="off" />
    <select id="dateFilter">
      <option value="">Any time</option>
      <option value="1">Last 24 h</option>
      <option value="7" selected>Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last year</option>
    </select>
    <select id="typeFilter">
      <option value="video">Videos</option>
      <option value="any">Any type</option>
    </select>
    <button id="searchBtn">Search</button>
  </div>

  <div class="meta" id="metaBar">&nbsp;</div>

  <div id="status"></div>
  <div id="results"></div>
  <div class="pagination" id="pagination"></div>
</main>

<script src="config.js"></script>
<script>
// ── Constants ──────────────────────────────────────────────────────────────
const BAND_MAID_RE = /\bband[-\s]?mai(?:d|ko)\b/i;
const BASE_QUERY   = 'BAND-MAID OR BAND-MAIKO';
const MAX_RESULTS  = 25;   // per API page (max 50)
const DETAILS_CHUNK = 25;  // videos/detail batch size (API limit)

// ── State ──────────────────────────────────────────────────────────────────
let pageTokens   = [null];  // index 0 = first page
let currentPage  = 0;
let lastParams   = null;

// ── DOM refs ───────────────────────────────────────────────────────────────
const queryEl   = document.getElementById('query');
const dateEl    = document.getElementById('dateFilter');
const typeEl    = document.getElementById('typeFilter');
const searchBtn = document.getElementById('searchBtn');
const statusEl  = document.getElementById('status');
const resultsEl = document.getElementById('results');
const metaEl    = document.getElementById('metaBar');
const paginEl   = document.getElementById('pagination');

// ── Helpers ────────────────────────────────────────────────────────────────
function setStatus(msg, isError = false) {
  statusEl.className = isError ? 'error' : '';
  statusEl.innerHTML = msg;
}

function isoAfter(days) {
  if (!days) return null;
  const d = new Date();
  d.setDate(d.getDate() - Number(days));
  return d.toISOString();
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function formatDuration(iso) {
  if (!iso) return '';
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '';
  const h = parseInt(m[1] || 0), mi = parseInt(m[2] || 0), s = parseInt(m[3] || 0);
  if (h) return `${h}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${mi}:${String(s).padStart(2,'0')}`;
}

// ── API calls ──────────────────────────────────────────────────────────────
async function searchYT(pageToken) {
  const days    = dateEl.value;
  const extra   = queryEl.value.trim();
  const q       = extra ? `${BASE_QUERY} ${extra}` : BASE_QUERY;
  const type    = typeEl.value;

  const params = new URLSearchParams({
    part:       'snippet',
    q,
    type,
    order:      'date',
    maxResults: MAX_RESULTS,
    key:        YT_API_KEY,
  });
  if (isoAfter(days)) params.set('publishedAfter', isoAfter(days));
  if (pageToken)       params.set('pageToken', pageToken);

  const r = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${r.status}`);
  }
  return r.json();
}

async function getVideoDetails(ids) {
  const params = new URLSearchParams({
    part:      'contentDetails,statistics',
    id:        ids.join(','),
    key:       YT_API_KEY,
  });
  const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?${params}`);
  if (!r.ok) return {};
  const data = await r.json();
  return Object.fromEntries((data.items || []).map(v => [v.id, v]));
}

// ── Regex filter (title + description) ────────────────────────────────────
function matchesBandMaid(item) {
  const snip = item.snippet || {};
  return BAND_MAID_RE.test(snip.title || '') || BAND_MAID_RE.test(snip.description || '');
}

function matchedAs(item) {
  const snip = item.snippet || {};
  if (BAND_MAID_RE.test(snip.title || '')) return null; // obvious, no badge
  if (BAND_MAID_RE.test(snip.description || '')) return 'matched in description';
  return null;
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderResults(items, details) {
  resultsEl.innerHTML = '';
  if (!items.length) {
    setStatus('No matching results. Try broadening the date range or removing extra keywords.');
    return;
  }
  setStatus('');
  items.forEach(item => {
    const id      = item.id?.videoId || item.id;
    const snip    = item.snippet || {};
    const det     = details[id] || {};
    const dur     = formatDuration(det?.contentDetails?.duration);
    const thumb   = snip.thumbnails?.medium?.url || snip.thumbnails?.default?.url || '';
    const badge   = matchedAs(item);

    const a = document.createElement('a');
    a.className = 'result-item';
    a.href      = `https://www.youtube.com/watch?v=${id}`;
    a.target    = '_blank';
    a.rel       = 'noopener noreferrer';

    a.innerHTML = `
      <div class="thumb-wrap">
        ${thumb ? `<img src="${thumb}" alt="" loading="lazy" />` : ''}
        ${dur ? `<span class="duration">${dur}</span>` : ''}
      </div>
      <div class="info">
        <span class="title">${escHtml(snip.title || '')}</span>
        <span class="channel">${escHtml(snip.channelTitle || '')}</span>
        ${badge ? `<span class="match-badge">${badge}</span>` : ''}
        <span class="dateline">${formatDate(snip.publishedAt)}</span>
      </div>
    `;
    resultsEl.appendChild(a);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPagination() {
  paginEl.innerHTML = '';
  if (currentPage > 0) {
    const prev = document.createElement('button');
    prev.textContent = '← Prev';
    prev.onclick = () => goPage(currentPage - 1);
    paginEl.appendChild(prev);
  }
  if (pageTokens[currentPage + 1]) {
    const next = document.createElement('button');
    next.textContent = 'Next →';
    next.onclick = () => goPage(currentPage + 1);
    paginEl.appendChild(next);
  }
}

// ── Main flow ──────────────────────────────────────────────────────────────
async function runSearch(pageIndex) {
  if (!YT_API_KEY || YT_API_KEY === 'YOUR_API_KEY_HERE') {
    setStatus('⚠ Add your YouTube API key to config.js first.', true);
    return;
  }
  searchBtn.disabled = true;
  resultsEl.innerHTML = '';
  paginEl.innerHTML   = '';
  metaEl.innerHTML    = '&nbsp;';
  setStatus('<span class="spinner"></span>searching…');

  try {
    const token = pageTokens[pageIndex] || null;
    const data  = await searchYT(token);

    // Store next page token
    if (data.nextPageToken && !pageTokens[pageIndex + 1]) {
      pageTokens[pageIndex + 1] = data.nextPageToken;
    }

    const raw     = data.items || [];
    const matched = raw.filter(matchesBandMaid);
    const filtered = raw.length - matched.length;

    // Get video IDs for detail lookup (only actual videos)
    const videoIds = matched
      .filter(i => i.id?.kind === 'youtube#video' || typeof i.id === 'string')
      .map(i => i.id?.videoId || i.id)
      .filter(Boolean);

    const details = videoIds.length ? await getVideoDetails(videoIds) : {};

    const total      = data.pageInfo?.totalResults ?? '?';
    const quotaNote  = '<span class="warn">each search costs ~100 quota units</span>';
    metaEl.innerHTML =
      `~${Number(total).toLocaleString()} raw results · ` +
      `${matched.length} passed regex filter` +
      (filtered ? ` <span class="warn">(${filtered} filtered out)</span>` : '') +
      ` · page ${pageIndex + 1}` +
      ` · ${quotaNote}`;

    currentPage = pageIndex;
    renderResults(matched, details);
    renderPagination();

  } catch (err) {
    setStatus(`Error: ${err.message}`, true);
    console.error(err);
  } finally {
    searchBtn.disabled = false;
  }
}

function goPage(index) {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  runSearch(index);
}

function newSearch() {
  pageTokens  = [null];
  currentPage = 0;
  runSearch(0);
}

// ── Events ─────────────────────────────────────────────────────────────────
searchBtn.addEventListener('click', newSearch);
queryEl.addEventListener('keydown', e => { if (e.key === 'Enter') newSearch(); });

// Auto-run on load
window.addEventListener('DOMContentLoaded', newSearch);
</script>

</body>
</html>
