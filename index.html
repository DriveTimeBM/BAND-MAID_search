<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAND-MAID · Video Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f7f6f3;
      --surface: #ffffff;
      --border:  #e2e0d9;
      --text:    #1a1916;
      --muted:   #6b6960;
      --thumb:   #c8c5bc;
      --red:     #c0392b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #111110;
        --surface: #1c1b19;
        --border:  #2e2d2a;
        --text:    #f0ede6;
        --muted:   #908d85;
        --thumb:   #3a3935;
        --red:     #e05c4a;
      }
    }

    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.6; }

    header {
      padding: 2.5rem 0 1.25rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 400;
      color: var(--text);
    }
    header p {
      margin-top: 0.3rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
    }

    main { max-width: 860px; margin: 0 auto; padding: 0 1.25rem 4rem; }

    .controls {
      display: flex;
      gap: 0.5rem;
      padding: 1.4rem 0 1.1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field label { font-size: 0.68rem; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; }

    input[type="text"], input[type="number"], select {
      height: 38px;
      padding: 0 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--muted); }
    input::placeholder { color: var(--thumb); }

    input[type="number"] { width: 80px; }

    .hours-wrap { display: flex; gap: 0.4rem; align-items: center; }

    button#searchBtn {
      height: 38px;
      padding: 0 1.2rem;
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity 0.15s;
      align-self: flex-end;
    }
    button#searchBtn:hover { opacity: 0.82; }
    button#searchBtn:active { opacity: 0.65; }
    button#searchBtn:disabled { opacity: 0.35; cursor: default; }

    .meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
      min-height: 1.4rem;
    }
    .meta .warn { color: var(--red); }

    #status {
      text-align: center;
      padding: 2.5rem 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    #status.error { color: var(--red); }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 1.5px solid var(--border);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: flex; flex-direction: column; }

    .result-item {
      display: grid;
      grid-template-columns: 156px 1fr;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.1s;
      border-radius: 4px;
    }
    .result-item:hover {
      background: var(--surface);
      padding-left: 0.75rem;
      padding-right: 0.75rem;
      margin-left: -0.75rem;
      margin-right: -0.75rem;
    }

    .thumb-wrap {
      position: relative;
      width: 156px;
      aspect-ratio: 16/9;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .duration {
      position: absolute;
      bottom: 4px; right: 5px;
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.63rem;
      padding: 1px 5px;
      border-radius: 2px;
    }

    .info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }

    .info .title {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .info .channel {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }
    .info .dateline {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--thumb);
      margin-top: auto;
      padding-top: 0.25rem;
    }
    .match-badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      background: var(--border);
      color: var(--muted);
      border-radius: 2px;
      padding: 1px 5px;
      margin-top: 0.15rem;
      align-self: flex-start;
    }

    @media (max-width: 500px) {
      .result-item { grid-template-columns: 110px 1fr; }
      .thumb-wrap { width: 110px; }
    }
  </style>
</head>
<body>

<header>
  <h1>BAND-MAID · Video Search</h1>
  <p>band-maid &amp; band-maiko · recent videos</p>
</header>

<main>
  <div class="controls">

    <div class="field" style="flex:1; min-width:160px;">
      <label for="queryInput">Extra keywords</label>
      <input type="text" id="queryInput" placeholder="Optional…" autocomplete="off" />
    </div>

    <div class="field">
      <label>Hours back</label>
      <div class="hours-wrap">
        <select id="hourPreset">
          <option value="6">6 hrs</option>
          <option value="12">12 hrs</option>
          <option value="24" selected>24 hrs</option>
          <option value="48">48 hrs</option>
          <option value="72">72 hrs</option>
          <option value="168">1 week</option>
          <option value="336">2 weeks</option>
          <option value="720">30 days</option>
          <option value="custom">Custom…</option>
        </select>
        <input type="number" id="hourCustom" min="1" max="8760" placeholder="hrs"
               style="display:none;" title="Hours back" />
      </div>
    </div>

    <button id="searchBtn">Search</button>

  </div>

  <div class="meta" id="metaBar">&nbsp;</div>
  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
// ── API key — restrict this in Google Cloud Console to your GitHub Pages domain ──
const YT_API_KEY = 'YOUR_API_KEY_HERE';

function getApiKey() {
  return (YT_API_KEY && YT_API_KEY !== 'YOUR_API_KEY_HERE') ? YT_API_KEY : null;
}

// ── Constants ──────────────────────────────────────────────────────────────
const BAND_MAID_RE = /\bband[-\s]?mai(?:d|ko)\b/i;
const BASE_QUERY   = '"BAND-MAID" OR "BAND-MAIKO"';

// ── DOM refs ───────────────────────────────────────────────────────────────
const queryInput = document.getElementById('queryInput');
const hourPreset = document.getElementById('hourPreset');
const hourCustom = document.getElementById('hourCustom');
const searchBtn  = document.getElementById('searchBtn');
const statusEl   = document.getElementById('status');
const resultsEl  = document.getElementById('results');
const metaEl     = document.getElementById('metaBar');

// ── Preset ↔ custom toggle ─────────────────────────────────────────────────
hourPreset.addEventListener('change', () => {
  const isCustom = hourPreset.value === 'custom';
  hourCustom.style.display = isCustom ? 'block' : 'none';
  if (isCustom) hourCustom.focus();
});

function getHours() {
  if (hourPreset.value === 'custom') {
    const v = parseInt(hourCustom.value, 10);
    return (!isNaN(v) && v >= 1) ? v : 24;
  }
  return parseInt(hourPreset.value, 10);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setStatus(html, isError) {
  statusEl.className = isError ? 'error' : '';
  statusEl.innerHTML = html;
}

function publishedAfterISO(hours) {
  return new Date(Date.now() - hours * 3600 * 1000).toISOString();
}

function formatDate(iso) {
  return new Date(iso).toLocaleString('en-US', {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function formatDuration(iso) {
  if (!iso) return '';
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '';
  const h = parseInt(m[1] || 0), mi = parseInt(m[2] || 0), s = parseInt(m[3] || 0);
  return h
    ? `${h}:${String(mi).padStart(2, '0')}:${String(s).padStart(2, '0')}`
    : `${mi}:${String(s).padStart(2, '0')}`;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Regex helpers ──────────────────────────────────────────────────────────
function matchesBandMaid(snip) {
  return BAND_MAID_RE.test(snip.title || '') ||
         BAND_MAID_RE.test(snip.description || '');
}

function matchedWhere(snip) {
  if (!BAND_MAID_RE.test(snip.title || '') &&
       BAND_MAID_RE.test(snip.description || '')) {
    return 'matched in description';
  }
  return null;
}

// ── YouTube API wrappers ───────────────────────────────────────────────────
async function ytFetch(endpoint, params) {
  params.key = getApiKey();
  const url = 'https://www.googleapis.com/youtube/v3/' + endpoint +
              '?' + new URLSearchParams(params);
  const r = await fetch(url);
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${r.status}`);
  }
  return r.json();
}

async function searchPage(publishedAfter, pageToken) {
  const extra = queryInput.value.trim();
  const q = extra ? `${BASE_QUERY} ${extra}` : BASE_QUERY;
  const p = {
    part: 'snippet',
    q,
    type: 'video',
    order: 'date',
    maxResults: 50,
    publishedAfter,
  };
  if (pageToken) p.pageToken = pageToken;
  return ytFetch('search', p);
}

async function getDetails(ids) {
  if (!ids.length) return {};
  const data = await ytFetch('videos', {
    part: 'contentDetails',
    id: ids.join(','),
  });
  return Object.fromEntries((data.items || []).map(v => [v.id, v]));
}

// ── Main ───────────────────────────────────────────────────────────────────
async function runSearch() {
  if (!getApiKey()) {
    setStatus(
      'No API key set. Edit index.html and replace <code>YOUR_API_KEY_HERE</code> with your YouTube Data API v3 key.',
      true
    );
    return;
  }

  searchBtn.disabled = true;
  resultsEl.innerHTML = '';
  metaEl.innerHTML = '&nbsp;';
  setStatus('<span class="spinner"></span>searching…');

  const hours = getHours();
  const publishedAfter = publishedAfterISO(hours);

  try {
    // Pull up to 2 pages (max 100 raw results) then filter + cap at 50
    let allItems = [];
    let nextToken = null;
    let pages = 0;

    do {
      const data = await searchPage(publishedAfter, nextToken);
      allItems = allItems.concat(data.items || []);
      nextToken = data.nextPageToken || null;
      pages++;
    } while (false); // single page only — 50 results max

    const rawCount = allItems.length;

    // Regex filter
    const matched = allItems.filter(i => matchesBandMaid(i.snippet || {}));

    // Sort most-recent first
    matched.sort((a, b) =>
      new Date(b.snippet.publishedAt) - new Date(a.snippet.publishedAt)
    );

    // Cap at 50
    const capped   = matched.slice(0, 50);
    const filtered = rawCount - matched.length;

    // Fetch durations for video results
    const videoIds = capped.map(i => i.id?.videoId).filter(Boolean);
    const details  = await getDetails(videoIds);

    // Meta bar
    metaEl.innerHTML =
      `${rawCount} fetched · ${matched.length} matched regex` +
      (filtered ? ` · <span class="warn">${filtered} filtered out</span>` : '') +
      ` · showing ${capped.length}` +
      ` · last ${hours} hr${hours === 1 ? '' : 's'}` +
      ` · ~${pages * 100} quota units`;

    setStatus('');

    if (!capped.length) {
      setStatus('No matching results in that time window. Try a wider range.');
      return;
    }

    capped.forEach(item => {
      const id    = item.id?.videoId;
      const snip  = item.snippet || {};
      const dur   = formatDuration(details[id]?.contentDetails?.duration);
      const thumb = snip.thumbnails?.medium?.url || snip.thumbnails?.default?.url || '';
      const badge = matchedWhere(snip);

      const a = document.createElement('a');
      a.className = 'result-item';
      a.href      = `https://www.youtube.com/watch?v=${id}`;
      a.target    = '_blank';
      a.rel       = 'noopener noreferrer';
      a.innerHTML = `
        <div class="thumb-wrap">
          ${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy" />` : ''}
          ${dur   ? `<span class="duration">${esc(dur)}</span>` : ''}
        </div>
        <div class="info">
          <span class="title">${esc(snip.title || '')}</span>
          <span class="channel">${esc(snip.channelTitle || '')}</span>
          ${badge ? `<span class="match-badge">${badge}</span>` : ''}
          <span class="dateline">${formatDate(snip.publishedAt)}</span>
        </div>`;
      resultsEl.appendChild(a);
    });

  } catch (err) {
    setStatus(`Error: ${esc(err.message)}`, true);
    console.error(err);
  } finally {
    searchBtn.disabled = false;
  }
}

// ── Events ─────────────────────────────────────────────────────────────────
searchBtn.addEventListener('click', runSearch);
queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
hourCustom.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

// Prompt rather than auto-run — avoids burning quota on page load
setStatus('Press Search to find recent videos.');
</script>


</body>
</html>
