<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAND-MAID · Video Search</title>
  <script src="config.js" onerror="void 0;"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f7f6f3;
      --surface: #ffffff;
      --border:  #e2e0d9;
      --text:    #1a1916;
      --muted:   #6b6960;
      --thumb:   #c8c5bc;
      --red:     #c0392b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #111110;
        --surface: #1c1b19;
        --border:  #2e2d2a;
        --text:    #f0ede6;
        --muted:   #908d85;
        --thumb:   #3a3935;
        --red:     #e05c4a;
      }
    }

    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.5; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.7rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      white-space: nowrap;
    }
    header p {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Layout ── */
    main { max-width: 1140px; margin: 0 auto; padding: 0 1.25rem 3rem; }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .field { display: flex; align-items: center; gap: 0.3rem; }
    .field label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    input[type="text"], input[type="number"], select {
      height: 28px;
      padding: 0 0.55rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.12s;
    }
    input:focus, select:focus { border-color: var(--muted); }
    input::placeholder { color: var(--thumb); }
    input[type="number"] { width: 62px; }
    #queryInput { min-width: 150px; }

    .hours-wrap { display: flex; gap: 0.3rem; align-items: center; }

    button#searchBtn {
      height: 28px;
      padding: 0 0.9rem;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 3px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    button#searchBtn:hover { opacity: 0.8; }
    button#searchBtn:active { opacity: 0.6; }
    button#searchBtn:disabled { opacity: 0.35; cursor: default; }

    /* ── Meta ── */
    .meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.67rem;
      color: var(--muted);
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--border);
      min-height: 1.5rem;
    }
    .meta .warn { color: var(--red); }

    /* ── Status ── */
    #status {
      text-align: center;
      padding: 2rem 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
    #status.error { color: var(--red); }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 1.5px solid var(--border);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Two-column results grid ── */
    #results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    /* Each cell: left col gets right border, both cols get bottom border */
    .result-item {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 0.55rem;
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.1s;
    }
    /* left column cells get a right border to form the divider */
    .result-item:nth-child(odd)  { border-right: 1px solid var(--border); }

    .result-item:hover { background: var(--surface); }

    /* ── Thumbnail ── */
    .thumb-wrap {
      position: relative;
      width: 100px;
      aspect-ratio: 16/9;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .duration {
      position: absolute;
      bottom: 3px; right: 3px;
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      padding: 1px 4px;
      border-radius: 2px;
    }

    /* ── Info ── */
    .info { display: flex; flex-direction: column; min-width: 0; gap: 0.1rem; }

    .info .title {
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .info .channel {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
    }
    .info .dateline {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--thumb);
      margin-top: auto;
    }
    .match-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.57rem;
      background: var(--border);
      color: var(--muted);
      border-radius: 2px;
      padding: 0 4px;
      align-self: flex-start;
    }

    /* ── Responsive: single column on narrow screens ── */
    @media (max-width: 580px) {
      #results { grid-template-columns: 1fr; }
      .result-item:nth-child(odd) { border-right: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>BAND-MAID · Video Search</h1>
  <p>band-maid &amp; band-maiko · recent videos</p>
</header>

<main>
  <div class="controls">

    <div class="field">
      <label for="queryInput">Keywords</label>
      <input type="text" id="queryInput" placeholder="Optional…" autocomplete="off" />
    </div>

    <div class="field">
      <label>Hours back</label>
      <div class="hours-wrap">
        <select id="hourPreset">
          <option value="6">6 hrs</option>
          <option value="12">12 hrs</option>
          <option value="24" selected>24 hrs</option>
          <option value="48">48 hrs</option>
          <option value="72">72 hrs</option>
          <option value="168">1 week</option>
          <option value="336">2 weeks</option>
          <option value="720">30 days</option>
          <option value="custom">Custom…</option>
        </select>
        <input type="number" id="hourCustom" min="1" max="8760" placeholder="hrs" style="display:none;" />
      </div>
    </div>

    <button id="searchBtn">Search</button>

  </div>

  <div class="meta" id="metaBar">&nbsp;</div>
  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
// ── API key — restrict in Google Cloud Console to your GitHub Pages domain ──
const YT_API_KEY = 'YOUR_API_KEY_HERE';

function getApiKey() {
  return (YT_API_KEY && YT_API_KEY !== 'YOUR_API_KEY_HERE') ? YT_API_KEY : null;
}

// ── Constants ──────────────────────────────────────────────────────────────
const BAND_MAID_RE = /\bband[-\s]?mai(?:d|ko)\b/i;
const BASE_QUERY   = '"BAND-MAID" OR "BAND-MAIKO"';

// ── DOM ────────────────────────────────────────────────────────────────────
const queryInput = document.getElementById('queryInput');
const hourPreset = document.getElementById('hourPreset');
const hourCustom = document.getElementById('hourCustom');
const searchBtn  = document.getElementById('searchBtn');
const statusEl   = document.getElementById('status');
const resultsEl  = document.getElementById('results');
const metaEl     = document.getElementById('metaBar');

// ── Hours control ──────────────────────────────────────────────────────────
hourPreset.addEventListener('change', () => {
  const isCustom = hourPreset.value === 'custom';
  hourCustom.style.display = isCustom ? 'inline-block' : 'none';
  if (isCustom) hourCustom.focus();
});

function getHours() {
  if (hourPreset.value === 'custom') {
    const v = parseInt(hourCustom.value, 10);
    return (!isNaN(v) && v >= 1) ? v : 24;
  }
  return parseInt(hourPreset.value, 10);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setStatus(html, isError) {
  statusEl.className = isError ? 'error' : '';
  statusEl.innerHTML = html;
}

function publishedAfterISO(hours) {
  return new Date(Date.now() - hours * 3600 * 1000).toISOString();
}

function formatDate(iso) {
  return new Date(iso).toLocaleString('en-US', {
    month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function formatDuration(iso) {
  if (!iso) return '';
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '';
  const h = parseInt(m[1]||0), mi = parseInt(m[2]||0), s = parseInt(m[3]||0);
  return h
    ? `${h}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${mi}:${String(s).padStart(2,'0')}`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Regex helpers ──────────────────────────────────────────────────────────
function matchesBandMaid(snip) {
  return BAND_MAID_RE.test(snip.title || '') || BAND_MAID_RE.test(snip.description || '');
}
function matchedWhere(snip) {
  return (!BAND_MAID_RE.test(snip.title || '') && BAND_MAID_RE.test(snip.description || ''))
    ? 'desc' : null;
}

// ── API ────────────────────────────────────────────────────────────────────
async function ytFetch(endpoint, params) {
  params.key = getApiKey();
  const r = await fetch('https://www.googleapis.com/youtube/v3/' + endpoint + '?' + new URLSearchParams(params));
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${r.status}`);
  }
  return r.json();
}

async function searchYT(publishedAfter) {
  const extra = queryInput.value.trim();
  return ytFetch('search', {
    part: 'snippet',
    q: extra ? `${BASE_QUERY} ${extra}` : BASE_QUERY,
    type: 'video',
    order: 'date',
    maxResults: 50,
    publishedAfter,
  });
}

async function getDetails(ids) {
  if (!ids.length) return {};
  const data = await ytFetch('videos', { part: 'contentDetails', id: ids.join(',') });
  return Object.fromEntries((data.items || []).map(v => [v.id, v]));
}

// ── Main ───────────────────────────────────────────────────────────────────
async function runSearch() {
  if (!getApiKey()) {
    setStatus('No API key set — replace <code>YOUR_API_KEY_HERE</code> in index.html.', true);
    return;
  }

  searchBtn.disabled = true;
  resultsEl.innerHTML = '';
  metaEl.innerHTML = '&nbsp;';
  setStatus('<span class="spinner"></span>searching…');

  const hours = getHours();

  try {
    const data     = await searchYT(publishedAfterISO(hours));
    const raw      = data.items || [];
    const matched  = raw.filter(i => matchesBandMaid(i.snippet || {}));
    const filtered = raw.length - matched.length;

    // Sort most-recent first
    matched.sort((a, b) => new Date(b.snippet.publishedAt) - new Date(a.snippet.publishedAt));

    const videoIds = matched.map(i => i.id?.videoId).filter(Boolean);
    const details  = await getDetails(videoIds);

    metaEl.innerHTML =
      `${raw.length} fetched · ${matched.length} matched` +
      (filtered ? ` · <span class="warn">${filtered} filtered out</span>` : '') +
      ` · last ${hours} hr${hours === 1 ? '' : 's'} · ~100 quota units`;

    setStatus('');

    if (!matched.length) {
      setStatus('No matching results. Try a wider time range.');
      return;
    }

    matched.forEach(item => {
      const id    = item.id?.videoId;
      const snip  = item.snippet || {};
      const dur   = formatDuration(details[id]?.contentDetails?.duration);
      const thumb = snip.thumbnails?.medium?.url || snip.thumbnails?.default?.url || '';
      const badge = matchedWhere(snip);

      const a = document.createElement('a');
      a.className = 'result-item';
      a.href      = `https://www.youtube.com/watch?v=${id}`;
      a.target    = '_blank';
      a.rel       = 'noopener noreferrer';
      a.innerHTML = `
        <div class="thumb-wrap">
          ${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy" />` : ''}
          ${dur   ? `<span class="duration">${esc(dur)}</span>` : ''}
        </div>
        <div class="info">
          <span class="title">${esc(snip.title || '')}</span>
          <span class="channel">${esc(snip.channelTitle || '')}</span>
          ${badge ? `<span class="match-badge">desc match</span>` : ''}
          <span class="dateline">${formatDate(snip.publishedAt)}</span>
        </div>`;
      resultsEl.appendChild(a);
    });

  } catch (err) {
    setStatus(`Error: ${esc(err.message)}`, true);
    console.error(err);
  } finally {
    searchBtn.disabled = false;
  }
}

// ── Events ─────────────────────────────────────────────────────────────────
searchBtn.addEventListener('click', runSearch);
queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
hourCustom.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

</script>


</body>
</html>
